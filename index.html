<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920,initial-scale=1,user-scalable=no" />
  <title>Tableau de bord</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="grid">

    <section id="clock" class="widget widget--clock">
      <div class="clock-photo" aria-hidden="true"></div>

      <button class="photo-settings" id="photo-settings" aria-label="Modifier la photo de fond" aria-haspopup="menu">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 6.5h2.5L7 4.5h6L14.5 6.5H17v9.5H3V6.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="10" cy="11" r="3" stroke="currentColor" stroke-width="1.6"/>
        </svg>
      </button>

      <div class="photo-menu hidden" id="photo-menu" role="menu">
        <button type="button" class="photo-menu-btn" id="photo-choose" role="menuitem">Choisir une photo</button>
        <button type="button" class="photo-menu-btn" id="photo-reset" role="menuitem">Réinitialiser</button>
      </div>

      <input type="file" id="photo-input" accept="image/*" hidden />

      <div class="clock-overlay">
        <div class="clock-top">
          <div class="clock-date" id="clock-date">&nbsp;</div>
          <div class="clock-time" id="clock-time">--:--</div>
        </div>

        <section class="notifications" id="notifications" aria-live="polite">
          <div class="notif-label">Aujourd'hui</div>
          <div class="notif-list" id="notif-list">
            <div class="notif-empty">—</div>
          </div>
        </section>

        <div class="weather-bottom">
          <div id="weather" class="weather-overlay" role="button" tabindex="0" aria-label="Toucher pour actualiser la météo">
            <div class="weather-overlay-main">
              <div class="weather-temp" id="weather-temp">—°</div>
              <div class="weather-icon" id="weather-icon" aria-hidden="true"></div>
            </div>
            <div class="weather-overlay-stats">
              <span class="weather-overlay-stat"><span class="weather-overlay-stat-label">Max</span><span id="weather-max">—°</span></span>
              <span class="weather-overlay-stat"><span class="weather-overlay-stat-label">Min</span><span id="weather-min">—°</span></span>
            </div>
            <span class="weather-overlay-desc" id="weather-desc">&nbsp;</span>
          </div>
          <div class="weather-hourly" id="weather-hourly" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <section id="calendar" class="widget widget--calendar">
      <header class="cal-header">
        <button class="cal-nav" id="cal-prev" aria-label="Mois précédent">&larr;</button>
        <h2 class="cal-title" id="cal-title">&nbsp;</h2>
        <button class="cal-nav" id="cal-next" aria-label="Mois suivant">&rarr;</button>
      </header>
      <div class="cal-weekdays">
        <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>

      <div class="cal-overlay hidden" id="cal-overlay">
        <div class="cal-overlay-inner">
          <div class="cal-overlay-msg" id="cal-overlay-msg">Connecter Google Calendar</div>
          <button class="btn btn--primary" id="cal-connect">Connecter</button>
        </div>
      </div>
    </section>

  </main>

  <div class="day-panel hidden" id="day-panel" role="dialog" aria-modal="true" aria-labelledby="day-panel-title">
    <header class="day-panel-header">
      <h3 class="day-panel-title" id="day-panel-title">&nbsp;</h3>
      <button class="day-panel-close" id="day-panel-close" aria-label="Fermer">&times;</button>
    </header>
    <button class="btn btn--ghost btn--add" id="day-add">+ Ajouter un événement</button>
    <div class="day-events" id="day-events"></div>

    <form class="day-form hidden" id="day-form" autocomplete="off">
      <label class="form-row">
        <span class="form-label">Titre</span>
        <input type="text" id="form-title" required maxlength="200" />
      </label>
      <label class="form-row form-row--toggle">
        <span class="form-label">Toute la journée</span>
        <input type="checkbox" id="form-allday" />
      </label>
      <div class="form-row form-row--times" id="form-times-row">
        <label class="form-half">
          <span class="form-label">Début</span>
          <input type="time" id="form-start" required />
        </label>
        <label class="form-half">
          <span class="form-label">Fin</span>
          <input type="time" id="form-end" required />
        </label>
      </div>
      <div class="form-row">
        <span class="form-label">Couleur</span>
        <div class="form-colors">
          <button type="button" class="swatch swatch--blue is-selected" data-color="blue" aria-label="Bleu"></button>
          <button type="button" class="swatch swatch--green" data-color="green" aria-label="Vert"></button>
          <button type="button" class="swatch swatch--amber" data-color="amber" aria-label="Ambre"></button>
        </div>
      </div>
      <div class="form-error hidden" id="form-error"></div>
      <div class="form-actions">
        <button type="button" class="btn btn--ghost" id="form-cancel">Annuler</button>
        <button type="submit" class="btn btn--primary" id="form-save">Enregistrer</button>
      </div>
    </form>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js" defer></script>
</body>
</html>
