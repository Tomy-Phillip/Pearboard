<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920,initial-scale=1,user-scalable=no" />
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="grid">

    <section id="clock" class="widget widget--clock">
      <div class="clock-time" id="clock-time">--:--:--</div>
      <div class="clock-date" id="clock-date">&nbsp;</div>
    </section>

    <section id="weather" class="widget widget--weather" role="button" tabindex="0" aria-label="Tap to refresh weather">
      <div class="widget-label" id="weather-label">Weather</div>
      <div class="weather-temp" id="weather-temp">—°</div>
      <div class="weather-desc" id="weather-desc">&nbsp;</div>
      <div class="weather-stats">
        <div class="weather-stat"><span class="weather-stat-label">H/L</span><span id="weather-hilo">—/—</span></div>
        <div class="weather-stat"><span class="weather-stat-label">Wind</span><span id="weather-wind">—</span></div>
        <div class="weather-stat"><span class="weather-stat-label">Humidity</span><span id="weather-humidity">—</span></div>
      </div>
    </section>

    <section id="calendar" class="widget widget--calendar">
      <header class="cal-header">
        <button class="cal-nav" id="cal-prev" aria-label="Previous month">&larr;</button>
        <h2 class="cal-title" id="cal-title">&nbsp;</h2>
        <button class="cal-nav" id="cal-next" aria-label="Next month">&rarr;</button>
      </header>
      <div class="cal-weekdays">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>

      <div class="cal-overlay hidden" id="cal-overlay">
        <div class="cal-overlay-inner">
          <div class="cal-overlay-msg" id="cal-overlay-msg">Connect Google Calendar</div>
          <button class="btn btn--primary" id="cal-connect">Connect</button>
        </div>
      </div>
    </section>

  </main>

  <div class="day-panel hidden" id="day-panel" role="dialog" aria-modal="true" aria-labelledby="day-panel-title">
    <header class="day-panel-header">
      <h3 class="day-panel-title" id="day-panel-title">&nbsp;</h3>
      <button class="day-panel-close" id="day-panel-close" aria-label="Close">&times;</button>
    </header>
    <button class="btn btn--ghost btn--add" id="day-add">+ Add event</button>
    <div class="day-events" id="day-events"></div>

    <form class="day-form hidden" id="day-form" autocomplete="off">
      <label class="form-row">
        <span class="form-label">Title</span>
        <input type="text" id="form-title" required maxlength="200" />
      </label>
      <label class="form-row form-row--toggle">
        <span class="form-label">All-day</span>
        <input type="checkbox" id="form-allday" />
      </label>
      <div class="form-row form-row--times" id="form-times-row">
        <label class="form-half">
          <span class="form-label">Start</span>
          <input type="time" id="form-start" required />
        </label>
        <label class="form-half">
          <span class="form-label">End</span>
          <input type="time" id="form-end" required />
        </label>
      </div>
      <div class="form-row">
        <span class="form-label">Color</span>
        <div class="form-colors">
          <button type="button" class="swatch swatch--blue is-selected" data-color="blue" aria-label="Blue"></button>
          <button type="button" class="swatch swatch--green" data-color="green" aria-label="Green"></button>
          <button type="button" class="swatch swatch--amber" data-color="amber" aria-label="Amber"></button>
        </div>
      </div>
      <div class="form-error hidden" id="form-error"></div>
      <div class="form-actions">
        <button type="button" class="btn btn--ghost" id="form-cancel">Cancel</button>
        <button type="submit" class="btn btn--primary" id="form-save">Save</button>
      </div>
    </form>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js" defer></script>
</body>
</html>
