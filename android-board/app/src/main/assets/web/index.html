<!DOCTYPE html>
<html lang="fr-CA">

<head>
  <meta charset="UTF-8" />
  <!-- No initial-scale: it would pin 1 CSS px to the screen density (2x on a 1080p
       Fire TV) and crop the layout; MainActivity's loadWithOverviewMode fits 1920 to the width. -->
  <meta name="viewport" content="width=1920,user-scalable=no" />
  <title>Tableau de bord</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Generated at build time (calendar names and colors, rotation); sets <html data-rotate>
       before first paint so the page never shows unrotated. -->
  <script src="config.js"></script>
</head>

<body>
  <!-- The 1080×1920 portrait board, turned to fit the landscape output (style.css). -->
  <div class="stage" id="stage">

    <div class="top-row">
      <section class="card card--clock">
        <div class="clock-time" id="clock-time">--:--</div>
        <div class="clock-date">
          <div class="clock-weekday" id="clock-weekday">&nbsp;</div>
          <div class="clock-day" id="clock-day">&nbsp;</div>
        </div>
      </section>

      <section class="card card--weather" id="weather">
        <div class="weather-head">
          <span class="weather-city">Montréal</span>
          <span class="weather-range" id="weather-range">&nbsp;</span>
        </div>
        <div class="weather-main">
          <div class="weather-icon" id="weather-icon" aria-hidden="true"></div>
          <div class="weather-temp" id="weather-temp">—°</div>
        </div>
        <div class="weather-desc" id="weather-desc">&nbsp;</div>
        <div class="weather-hourly" id="weather-hourly"></div>
      </section>
    </div>

    <section class="card card--calendar" id="calendar">
      <header class="cal-header">
        <h2 class="cal-title" id="cal-title">&nbsp;</h2>
        <span class="cal-nav" aria-hidden="true">&lsaquo;</span>
        <span class="cal-nav" aria-hidden="true">&rsaquo;</span>
        <div class="cal-status hidden" id="cal-status"></div>
        <div class="view-toggle" aria-hidden="true">
          <span class="view-toggle-opt" id="view-week">Semaine</span>
          <span class="view-toggle-opt" id="view-month">Mois</span>
        </div>
      </header>
      <div class="cal-weekdays">
        <span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend" id="cal-legend"></div>

      <div class="cal-overlay hidden" id="cal-overlay">
        <div class="cal-overlay-msg" id="cal-overlay-msg">Chargement du calendrier…</div>
      </div>
    </section>

    <section class="card card--today">
      <header class="today-header">
        <h2 class="today-title">Événements du jour</h2>
        <span class="today-meta" id="today-meta">&nbsp;</span>
      </header>
      <div class="today-list" id="today-list"></div>
    </section>

    <div class="day-panel hidden" id="day-panel" role="dialog" aria-modal="true" aria-labelledby="day-panel-title">
      <div class="day-panel-box">
        <header class="day-panel-header">
          <h3 class="day-panel-title" id="day-panel-title">&nbsp;</h3>
          <button class="day-panel-close" id="day-panel-close" aria-label="Fermer">&times;</button>
        </header>
        <div class="day-events" id="day-events"></div>
      </div>
    </div>

  </div>

  <script src="app.js" defer></script>
</body>

</html>
